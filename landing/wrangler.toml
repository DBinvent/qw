name = "qw-landing"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

# `next build` (output: 'export') writes the site to ./out and Workers Static
# Assets serves it. The Worker runs for two paths only: forwarding /api/news/*
# to the deployment's own API server so the footer signup box has somewhere to
# post, and serving /i/<npub> invite links from the exported /invite/ page with
# per-key OG tags. See src/worker.ts.
[assets]
directory = "./out"
binding = "ASSETS"
# /i/* too: invite links are served by the Worker so their OG tags can be
# rewritten per npub before a LinkedIn scraper reads them (src/worker.ts).
# /gh/* is the short form of the same link — the Worker asks GitHub for the
# npub published on that handle's profile and redirects to /i/<npub>.
# /download/* resolves the current release from the manifest and redirects
# to the immutable versioned file — so a publish never needs a site deploy.
run_worker_first = ["/api/*", "/i/*", "/gh/*", "/download/*"]

[vars]
# API origin this Worker forwards /api/* to — the only backend the site has.
# Reached server-side from the Worker, never from the page (see src/worker.ts),
# so it needs no CORS. A fork running its own instance points this at its own
# API server; nothing else in the repo depends on the value.
BACKEND_ORIGIN = "https://qw-dash-api.knownby.work"
