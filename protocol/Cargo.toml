[package]
name = "qw-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "QW protocol layer: identity, Nostr event kinds, VC schema, dual indexing"

[lib]
name = "qw_protocol"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
multibase = "0.9.3"
secp256k1 = { version = "0.31.1", features = ["rand", "global-context", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
hex-literal = "1.1.0"
