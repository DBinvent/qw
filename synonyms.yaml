# QW skill tag synonyms
#
# Purpose: normalize free-text skill input to a canonical tag BEFORE signing.
# Fragmentation is unrecoverable once tags are in signed records — you cannot
# retroactively merge "nodejs" and "node.js" across everyone's history.
#
# Resolution order (client-side, at contract composition):
#   1. lowercase, trim, collapse whitespace to "-"
#   2. strip version suffix after "@" (keep as optional qualifier)
#   3. exact match against canonical keys in taxonomy.yaml -> accept
#   4. exact match against an alias below -> rewrite to canonical
#   5. no match -> accept as unrouted tag, flag for taxonomy review
#
# Note: version-bearing aliases (angular2, vuejs3, python3) resolve to the
# unversioned canonical. Version belongs in contract text, not the tag.
#
# Seeding: Stack Exchange publishes a tag synonym table and co-occurrence data.
# Import it to expand this file rather than curating by hand.

version: 1
updated: 2026-08-06

