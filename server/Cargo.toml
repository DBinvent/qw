[package]
name = "qw-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "QW optional coordination server: chain-calculation, rating-bureau, and vault services (§8) — a convenience/monetization layer, never a dependency of the peer-to-peer core"

[lib]
name = "qw_server"
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
qw-protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
