# QW skill taxonomy
#
# Levels:
#   1. sector   — top of tree (it). Reserved for future siblings.
#   2. domain   — trust scope. An endorsement is scoped here.
#   3. area     — routing bucket. Optional; omit where a domain is narrow.
#   4. skills   — leaf tags. Open set: unknown values are legal but unroutable
#                 until added or resolved via synonyms.yaml.
#
# Rules:
#   - Tag format: sector/domain[/area]#skill  e.g. it/backend/languages#rust
#   - Domains are a closed enum. Adding one is a protocol change.
#   - Skills are open. Normalize through synonyms.yaml before signing.
#   - No version numbers in skills. Use the optional @ qualifier if needed
#     (rust@1.8x), which matching ignores by default.
#   - Max 5 skill tags per contract.

